<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    /* A light sweep crosses the bolt every few seconds and two glints
       twinkle at its tips; both stay still for reduced-motion users. */
    .sheen { animation: sweep 5s ease-in-out infinite; }
    .glint { transform-box: fill-box; transform-origin: center; opacity: 0; animation: twinkle 5s ease-in-out infinite; }
    .glint-2 { animation-delay: 0.35s; }
    @keyframes sweep {
      0%, 25% { transform: translateX(-100px); }
      65%, 100% { transform: translateX(100px); }
    }
    @keyframes twinkle {
      0%, 48%, 72%, 100% { opacity: 0; transform: scale(0.4); }
      58% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sheen, .glint { animation: none; }
      .sheen { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bolt" x1="0.75" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7cf0b8"/>
      <stop offset="0.5" stop-color="#42b883"/>
      <stop offset="1" stop-color="#14967f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bolt-clip">
      <path d="M77 5 L21 72 H56 L49 123 L104 55 H69 Z"/>
    </clipPath>
  </defs>

  <path d="M77 5 L21 72 H56 L49 123 L104 55 H69 Z" fill="url(#bolt)"/>
  <path d="M77 5 L21 72 H56 L49 123 L104 55 H69 Z" fill="url(#shine)"/>
  <!-- thin rim light along the upper-left edges -->
  <path d="M77 5 L21 72 M69 55 H104" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" clip-path="url(#bolt-clip)"/>

  <g clip-path="url(#bolt-clip)">
    <g transform="rotate(20 64 64)">
      <rect class="sheen" x="42" y="-20" width="44" height="170" fill="url(#band)"/>
    </g>
  </g>

  <path class="glint" d="M80 2 Q81 8 87 9 Q81 10 80 16 Q79 10 73 9 Q79 8 80 2 Z" fill="#ffffff"/>
  <path class="glint glint-2" d="M104 49 Q104.8 54 109 55 Q104.8 56 104 61 Q103.2 56 99 55 Q103.2 54 104 49 Z" fill="#ffffff"/>
</svg>
