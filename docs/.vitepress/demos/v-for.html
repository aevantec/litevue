<div v-scope="{ items: [{ id: 1, text: 'a' }, { id: 2, text: 'b' }], next: 3 }">
  <ul>
    <li v-for="item in items" :key="item.id">{{ item.id }} — {{ item.text }}</li>
  </ul>

  <button @click="items.push({ id: next, text: 'item ' + next++ })">add</button>
  <button @click="items.reverse()">reverse</button>
  <button @click="items.pop()">pop</button>
</div>
