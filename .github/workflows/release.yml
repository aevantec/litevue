name: Release

on:
  push:
    branches: [main]
  # Lets release-please be re-run from the Actions tab without pushing a commit
  # to main — useful when a run failed for a reason outside the code, such as
  # the repository not yet allowing Actions to open pull requests.
  #
  # Safe to run at any time: release-please only refreshes its release PR, and
  # the publish job stays gated on release_created, which is only true when a
  # release PR is merged.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens/updates a "chore(main): release x.y.z" PR with the computed version and
  # generated changelog. Merging that PR creates the tag and the GitHub Release,
  # which sets release_created and triggers the publish job below.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # GitHub raises no workflow runs for events caused by GITHUB_TOKEN, so a
      # release PR opened with it got no checks at all — and since "Validate PR
      # title" is the only required check on main, it stayed unmergeable until
      # someone closed and reopened the PR by hand, every single release.
      #
      # An app token is a different identity, so its PR triggers workflows
      # normally. The token is minted per run and expires in an hour, unlike a
      # PAT that expires on a calendar and is tied to one person's account.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # deliberately no `|| secrets.GITHUB_TOKEN` fallback: that would
          # quietly restore the broken behaviour if the app is ever uninstalled
          # or the secrets go missing, instead of failing where it can be seen
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm authenticates this job by OIDC — no token anywhere. The package is
      # configured on npmjs.com with this repo and this workflow filename as a
      # trusted publisher; renaming this file breaks publishing until the
      # trusted publisher is updated to match.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      # version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package
        run: pnpm lint:package

      # No NODE_AUTH_TOKEN: the OIDC exchange above is the credential, and
      # access comes from publishConfig in package.json.
      #
      # Provenance is attached automatically when publishing this way, but only
      # once this repository is public — npm requires a publicly resolvable
      # repository, since an attestation nobody can check against the source is
      # worthless. 0.5.1 went out without one for that reason. Passing
      # --provenance explicitly while private makes the publish fail outright,
      # so the flag stays off and the check below reports the outcome instead.
      - name: Publish to npm
        run: npm publish

      # A new version is not always readable the instant `npm publish` returns.
      # 0.5.3 published fine and this step 404'd about a second later, failing
      # the run and skipping the provenance report below — while 0.5.2, same
      # workflow, passed. So it is a propagation race, not a permissions
      # problem: retry rather than trust a single immediate read.
      #
      # A genuine publish failure still fails the job, just after ~100s.
      - name: Verify it is on the registry
        run: |
          version='${{ needs.release-please.outputs.version }}'
          for attempt in $(seq 1 10); do
            if npm view "@aevantec/litevue@${version}" version 2>/dev/null; then
              echo "visible on the registry after ${attempt} attempt(s)"
              exit 0
            fi
            echo "not visible yet — retrying in 10s (${attempt}/10)"
            sleep 10
          done
          echo "::error::${version} did not appear on the registry within 100s"
          exit 1

      # always(): this reports on a publish that already happened, so it should
      # still run when the step above gave up waiting. 0.5.3 published without
      # anyone learning its provenance status, because this was skipped.
      - name: Report provenance status
        if: always()
        run: |
          version='${{ needs.release-please.outputs.version }}'
          if npm view "@aevantec/litevue@${version}" dist.attestations 2>/dev/null | grep -q provenance; then
            echo "provenance attestation present for ${version}"
          else
            echo "::warning::${version} published without a provenance attestation — expected while the repository is private, a regression once it is public"
          fi
