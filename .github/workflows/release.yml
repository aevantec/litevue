name: Release

on:
  push:
    branches: [main]
  # Lets release-please be re-run from the Actions tab without pushing a commit
  # to main — useful when a run failed for a reason outside the code, such as
  # the repository not yet allowing Actions to open pull requests.
  #
  # Safe to run at any time: release-please only refreshes its release PR, and
  # the publish job stays gated on release_created, which is only true when a
  # release PR is merged.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens/updates a "chore(main): release x.y.z" PR with the computed version and
  # generated changelog. Merging that PR creates the tag and the GitHub Release,
  # which sets release_created and triggers the publish job below.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # GitHub raises no workflow runs for events caused by GITHUB_TOKEN, so a
      # release PR opened with it got no checks at all — and since "Validate PR
      # title" is the only required check on main, it stayed unmergeable until
      # someone closed and reopened the PR by hand, every single release.
      #
      # An app token is a different identity, so its PR triggers workflows
      # normally. The token is minted per run and expires in an hour, unlike a
      # PAT that expires on a calendar and is tied to one person's account.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      # Held at v4 on purpose. v5 exists, but this action is the release path
      # and nothing in CI exercises it — a break only shows up at the moment a
      # release is being cut. Bump it on its own, deliberately, not alongside
      # actions that a green CI run actually verifies.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # deliberately no `|| secrets.GITHUB_TOKEN` fallback: that would
          # quietly restore the broken behaviour if the app is ever uninstalled
          # or the secrets go missing, instead of failing where it can be seen
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Safe to re-run with "Re-run failed jobs": the job outputs above are kept,
  # and scripts/publish-npm.mjs skips a version that is already published.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    # install + test + build take a few minutes; the registry wait allows ten
    timeout-minutes: 30
    permissions:
      contents: read
      # npm authenticates this job by OIDC — no token anywhere. The package is
      # configured on npmjs.com with this repo and this workflow filename as a
      # trusted publisher; renaming this file breaks publishing until the
      # trusted publisher is updated to match.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      # version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      # Pinned to the major rather than @latest, so a new npm major cannot
      # arrive unannounced in the one job nothing else exercises.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package
        run: pnpm lint:package

      # Publishes, waits until the registry shows the version, and reports
      # provenance. The registry can lag `npm publish` by over 90s — 0.5.7 went
      # red for that alone — and a re-run of a published version is skipped
      # rather than failed. See the script for the details.
      #
      # No NODE_AUTH_TOKEN: the OIDC exchange is the credential, and provenance
      # is attached automatically now that the repository is public.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/publish-npm.mjs "$VERSION"
