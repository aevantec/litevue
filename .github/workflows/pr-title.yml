name: PR title

# The PR title is the commit message on main (we squash-merge), and it's what
# release-please reads to compute the next version. A title that doesn't parse
# produces no release entry, silently — so it's checked here.
#
# pull_request_target is what lets this run on pull requests from forks. It is
# safe here only because this workflow never checks out or executes PR code; do
# not add a checkout step.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            core
            directives
            events
            devtools
            plugins
            store
            types
            docs
            extension
            ci
            build
            deps
            deps-dev
          # A scope is useful but not worth blocking a contribution over.
          requireScope: false
          # Dependabot writes "Bump x from 1 to 2" — capitalised, and not
          # something it can be configured out of. Skipping its PRs keeps the
          # style rule meaningful for humans instead of forcing an exception
          # into the pattern that everyone then copies.
          ignoreLabels: |
            dependencies
            autorelease: pending
            ignore-semantic-pull-request
          # Reject a capitalised first word, so subjects read like the rest of
          # the changelog: "add v-clipboard plugin", not "Add v-clipboard plugin".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the title "{title}" should start with a
            lowercase letter — e.g. "feat(plugins): add v-clipboard plugin".
