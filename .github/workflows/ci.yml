name: CI

on:
  # main-next is included because it is where work is actually integrated.
  # `pull_request` covers each branch on its own, but nothing tested the result
  # of merging them together: after a PR lands on main-next, the combined state
  # went unverified until the promotion PR — and even that can miss, since a
  # pull_request run needs a mergeable ref and is skipped while the PR has
  # conflicts. The branch whose entire job is integration was the least tested
  # thing here.
  push:
    branches: [main, main-next]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm prettier --check "**/*.{ts,mts,js,html,json}"

      - name: Type check
        run: pnpm tsc --noEmit

      # Catches the class that sits between prettier and tsc: dead code,
      # unusable regex escapes, and variables a guard depends on that are
      # never assigned. Rust-based, so the whole tree lints in about a second.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The plugins bundle must keep the core external. Inlining it gives that
      # bundle a second store registry, and persistence then fails silently.
      - name: Check bundle boundaries
        run: pnpm check:bundles

      - name: Check bundle sizes
        # Size is part of what this library promises. Without a gate it is
        # measured by hand, and a few hundred bytes of drift goes unnoticed
        # until a number quoted in the docs is simply wrong.
        run: pnpm check:size

      # Pinned CDN versions in the docs are rewritten by release-please, but
      # only on marked lines in registered files. Miss either and the URL is
      # frozen at whatever was typed, which nothing else would notice.
      - name: Check docs versions
        run: pnpm check:docs-versions

      # Sizes quoted in prose drift the way pinned versions do, and nothing
      # else notices: check:size compares a bundle to its budget, not to what
      # the docs claim. The devtools panel was advertised as ~5kb while the
      # bundle had grown to 6.1kb.
      - name: Check docs sizes
        run: pnpm check:docs-sizes

      # Cloudflare deploys the docs; this only checks they still compile
      # (VitePress fails the build on dead links and bad markdown).
      - name: Build docs
        run: pnpm docs:build

      # Catches exports-map and type-resolution breakage in review rather than
      # at publish time: every entry point must stay resolvable from both ESM
      # and CJS, and the .d.mts tree must match the .d.ts one.
      - name: Validate package
        run: pnpm lint:package

  # A separate job, not another step in `test`, for two reasons: it needs a
  # browser download the main job has no use for, and running the two in
  # parallel keeps the slowest path roughly where it was.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only chromium. These tests cover engine behaviour jsdom cannot model
      # at all — layout, focus, CSS transitions, IntersectionObserver — rather
      # than cross-browser differences, so a second engine would double the
      # runtime to re-prove the same thing.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser
