name: Bug report
description: Something in litevue doesn't work the way it's documented
labels: ['bug', 'needs-repro']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A **minimal reproduction** is the single most useful
        thing you can include — without one we usually can't act on the report.

        Questions and "how do I…" belong in
        [Discussions](https://github.com/aevantec/litevue/discussions).

  - type: input
    id: version
    attributes:
      label: litevue version
      description: 'Run `npm list litevue`, or give the CDN URL you loaded.'
      placeholder: 0.5.0
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: How are you loading it?
      options:
        - Script tag (CDN, IIFE build)
        - Bundler (npm, ESM)
        - Bundler (npm, CJS / require)
        - litevue/plugins
        - litevue/devtools
        - Browser extension
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A link to a StackBlitz / CodePen / repo, or a self-contained HTML snippet
        that reproduces the problem. Please strip out everything unrelated.
      placeholder: |
        https://stackblitz.com/edit/...

        or:

        <script src="https://unpkg.com/litevue" defer init></script>
        <div v-scope="{ count: 0 }">…</div>
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message and console output if there is one.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 15
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest version, or I've confirmed the bug still exists there.
          required: true
        - label: >-
            I've checked the [docs](https://litevue.pages.dev/) — including the
            [Vue compatibility and limitations](https://litevue.pages.dev/start-here/introduction)
            section, since litevue is intentionally a subset of Vue.
          required: true
