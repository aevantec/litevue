<script type="module">
  import { createApp } from '../src'
  import '../src/devtools-panel'
  createApp().mount()
</script>

<div id="counter" v-scope="{ count: 0, label: 'clicks', enabled: true }">
  <p id="count-display">{{ label }}: {{ count }}</p>
  <button id="inc" @click="count++" :disabled="!enabled">+1</button>
  <div id="nested" v-if="enabled" v-scope="{ note: 'inner' }">
    <p id="note-display">{{ note }} / {{ label }}</p>
  </div>
</div>

<div id="list" v-scope="{ items: ['a', 'b'], show: true }">
  <button id="toggle" @click="show = !show">toggle</button>
  <ul v-if="show">
    <li v-for="item in items">{{ item }}</li>
  </ul>
</div>
