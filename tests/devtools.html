<script type="module">
  import { createApp } from '../src'

  window.events = []
  __LITE_VUE__.on('scope:mount', (el, scope) => {
    window.events.push(['mount', el.id || el.tagName])
  })
  __LITE_VUE__.on('scope:unmount', (el) => {
    window.events.push(['unmount', el.id || el.tagName])
  })
  __LITE_VUE__.on('flush', () => {
    window.events.push(['flush'])
  })

  createApp().mount()
</script>

<div id="outer" v-scope="{ msg: 'hello', show: true }">
  <p id="msg">{{ msg }}</p>
  <button id="toggle" @click="show = !show">Toggle inner</button>
  <div id="inner" v-if="show" v-scope="{ count: 0 }">
    <p id="count">{{ count }}</p>
    <button id="inc" @click="count++">+1</button>
  </div>
</div>
