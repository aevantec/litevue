<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteVue dev</title>
    <script type="module" src="/dev/shell.ts"></script>
  </head>
  <body
    class="h-dvh overflow-hidden bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100"
  >
    <div class="flex h-full">
      <div
        id="backdrop"
        hidden
        class="fixed inset-0 z-10 bg-zinc-950/40 md:hidden"
      ></div>
      <aside
        id="sidebar"
        data-open="false"
        class="fixed inset-y-0 left-0 z-20 flex w-72 -translate-x-full flex-col border-r border-zinc-200 bg-white transition-transform data-[open=true]:translate-x-0 md:static md:translate-x-0 dark:border-zinc-800 dark:bg-zinc-900"
      >
        <a
          href="#"
          class="flex items-center gap-2 px-5 pt-5 pb-3 text-lg font-semibold"
        >
          <span
            class="grid size-7 place-items-center rounded-md bg-brand-500 text-sm font-bold text-white"
            aria-hidden="true"
            >L</span
          >
          LiteVue <span class="font-normal text-zinc-500">dev</span>
        </a>
        <div class="px-4 pb-3">
          <label class="relative block">
            <span class="sr-only">Search pages</span>
            <input
              id="search"
              type="search"
              placeholder="Search pages"
              autocomplete="off"
              class="peer w-full rounded-md border border-zinc-200 bg-zinc-50 py-1.5 pr-8 pl-3 text-sm outline-none placeholder:text-zinc-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 dark:border-zinc-700 dark:bg-zinc-800"
            />
            <kbd
              class="pointer-events-none absolute top-1/2 right-2 peer-focus:hidden peer-[:not(:placeholder-shown)]:hidden -translate-y-1/2 rounded border border-zinc-200 px-1.5 font-mono text-[10px] text-zinc-400 dark:border-zinc-700"
              >/</kbd
            >
          </label>
        </div>
        <nav
          id="nav"
          aria-label="Pages"
          class="flex-1 overflow-y-auto px-2 pb-6"
        ></nav>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <div
          class="flex items-center gap-3 border-b border-zinc-200 bg-white px-4 py-2 md:hidden dark:border-zinc-800 dark:bg-zinc-900"
        >
          <button
            id="menu"
            type="button"
            aria-controls="sidebar"
            class="rounded-md border border-zinc-200 px-2.5 py-1 text-sm dark:border-zinc-700"
          >
            ☰ Pages
          </button>
          <span class="font-semibold">LiteVue dev</span>
        </div>
        <main id="main" class="min-h-0 flex-1"></main>
      </div>
    </div>
  </body>
</html>
